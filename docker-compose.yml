version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: meowpurse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: meowpurse123
      MYSQL_DATABASE: meowpurse
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmeowpurse123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: meowpurse-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
